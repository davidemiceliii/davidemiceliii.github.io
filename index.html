<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica Accesso Area Mazara</title>
    <style>
        :root { --primary: #2563eb; --error: #dc2626; --success: #16a34a; }
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; color: #1e293b; }
        .container { background: white; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); text-align: center; max-width: 450px; width: 90%; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        p { color: #64748b; line-height: 1.5; margin-bottom: 1.5rem; }
        #status { font-weight: 600; margin-bottom: 1rem; min-height: 1.5rem; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 0.5rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; width: 100%; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Verifica Posizione</h1>
    <p>Per compilare il modulo, conferma la tua presenza entro 2km dall'area autorizzata a Mazara del Vallo.</p>
    
    <div id="status"></div>
    <button id="verifyBtn" class="btn" onclick="iniziaVerifica()">Consenti Posizione e Verifica</button>
</div>

<script>
    // --- CONFIGURAZIONE ---
    const DESTINAZIONE_FINALE = "https://forms.gle/Xga5xZQ5kroZqKRn8";
    const TARGET_LAT = 37.65114492461479;
    const TARGET_LON = 12.588888387889893;
    const RAGGIO_MAX_KM = 2.0;

    const statusDiv = document.getElementById('status');
    const verifyBtn = document.getElementById('verifyBtn');

    function deg2rad(deg) { return deg * (Math.PI / 180); }

    function calcolaDistanza(lat1, lon1, lat2, lon2) {
        const R = 6371; 
        const dLat = deg2rad(lat2 - lat1);
        const dLon = deg2rad(lon2 - lon1);
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function iniziaVerifica() {
        verifyBtn.disabled = true;
        statusDiv.innerHTML = '<span class="loader"></span> Acquisizione GPS...';
        statusDiv.style.color = "inherit";

        if (!navigator.geolocation) {
            mostraErrore("Il tuo browser non supporta la geolocalizzazione.");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const d = calcolaDistanza(TARGET_LAT, TARGET_LON, pos.coords.latitude, pos.coords.longitude);
                
                if (d <= RAGGIO_MAX_KM) {
                    statusDiv.style.color = "var(--success)";
                    statusDiv.innerHTML = "✅ Posizione verificata! Entro 2km.<br>Apertura modulo...";
                    setTimeout(() => { window.location.href = DESTINAZIONE_FINALE; }, 1500);
                } else {
                    mostraErrore(`Sei troppo lontano (${d.toFixed(2)} km). Devi essere entro 2km.`);
                    verifyBtn.disabled = false;
                }
            },
            (err) => {
                let msg = "Errore GPS: ";
                if(err.code === 1) msg += "Devi autorizzare l'accesso alla posizione.";
                else msg += "Impossibile determinare la posizione.";
                mostraErrore(msg);
                verifyBtn.disabled = false;
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function mostraErrore(testo) {
        statusDiv.style.color = "var(--error)";
        statusDiv.innerText = testo;
    }
</script>

</body>
</html>
