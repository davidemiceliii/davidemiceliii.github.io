<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRESENZE ASSEMBLEA</title>
    <style>
        :root { --primary: #059669; --error: #e11d48; --bg: #f1f5f9; }
        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background-color: var(--bg); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 1rem; }
        .container { background: white; padding: 2rem; border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; }
        h1 { font-size: 1.4rem; color: #0f172a; margin-bottom: 1rem; }
        p { color: #475569; line-height: 1.5; font-size: 0.95rem; }
        #status { font-weight: 700; margin: 1.5rem 0; font-size: 1rem; color: #475569; min-height: 1.5rem; }
        .btn { background: var(--primary); color: white; border: none; padding: 18px 30px; border-radius: 1rem; font-weight: 700; cursor: pointer; width: 100%; font-size: 1.1rem; transition: background 0.2s; }
        .btn:active { background: #047857; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .footer-note { font-size: 0.8rem; color: #94a3b8; margin-top: 1.5rem; }
    </style>
</head>
<body>

<div class="container" id="main-card">
    <div id="check-section">
        <h1>📍 Verifica Presenza</h1>
        <p>Per registrare la presenza, attiva il GPS. L'accesso è consentito solo a chi si trova dentro il rivoli.</p>
        
        <div id="status">In attesa di verifica...</div>
        
        <button id="verifyBtn" class="btn" onclick="eseguiProtocollo()">Sblocca e Apri Modulo</button>
        
        <p class="footer-note">Nota: Assicurati di aver effettuato l'accesso con la tua <b>email istituzionale</b>.</p>
    </div>
</div>

<script>

    const _0x4a2 = "aHR0cHM6Ly9kb2NzLmdvb2dsZS5jb20vZm9ybXMvZC9lLzFGQUlwUUxzZG1teE5rQzI0ZGlrcTB2QVFGWk01YnhhVzZ2ZnoyTExfVXpzenpfMnlBcU5PZjFRL3ZpZXdmb3JtP3VzcF1zaGFyaW5nJm91aWQ9MTEwMjE1MDQwOTc2Njk3ODc2OTMz";

    const TARGET_LAT = 37.651130667367816;
    const TARGET_LON = 12.588882399386437;
    const RAGGIO_MAX = 100;

    function calcola(l1, o1, l2, o2) {
        const R = 6371e3;
        const p1 = l1 * Math.PI/180;
        const p2 = l2 * Math.PI/180;
        const dp = (l2-l1) * Math.PI/180;
        const dl = (o2-o1) * Math.PI/180;
        const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function eseguiProtocollo() {
        const btn = document.getElementById('verifyBtn');
        const st = document.getElementById('status');
        btn.disabled = true;
        st.innerText = "Verifica coordinate...";
        st.style.color = "#475569";

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const d = calcola(TARGET_LAT, TARGET_LON, pos.coords.latitude, pos.coords.longitude);
                
                if (d <= RAGGIO_MAX) {
                    st.style.color = "var(--primary)";
                    st.innerText = "✅ Posizione verificata! Apertura modulo...";
                    
                    setTimeout(() => {
                        // Decodifica e reindirizzamento al nuovo link
                        const url = atob(_0x4a2); 
                        window.location.href = url;
                    }, 800);
                } else {
                    st.style.color = "var(--error)";
                    st.innerText = `ERRORE: Avvicinati per procedere, se ritieni sia un errore ricarica la pagina o riferisci ai rappresentanti.`;
                    btn.disabled = false;
                }
            },
            (error) => {
                st.style.color = "var(--error)";
                st.innerText = "Errore GPS: Consenti l'accesso alla posizione nelle impostazioni del browser, se ritieni sia un errore ricarica la pagina o riferisci ai rappresentanti.";
                btn.disabled = false;
            },
            { 
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }
</script>

</body>
</html>
